services:
  postgres:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        case "$$APP_DB_PASSWORD" in ''|*[!A-Za-z0-9_.-]*) echo 'APP_DB_PASSWORD must be a non-empty URL-safe value' >&2; exit 1;; esac
        case "$$KEYCLOAK_DB_PASSWORD" in ''|*[!A-Za-z0-9_.-]*) echo 'KEYCLOAK_DB_PASSWORD must be a non-empty URL-safe value' >&2; exit 1;; esac
        case "$$WIDGET_TOKEN" in ''|*[!A-Za-z0-9_.-]*) echo 'WIDGET_TOKEN must be a non-empty URL-safe value' >&2; exit 1;; esac
        cat > /docker-entrypoint-initdb.d/02-prod.sql <<SQL
        ALTER ROLE app_user WITH PASSWORD '$$APP_DB_PASSWORD';
        CREATE ROLE keycloak LOGIN PASSWORD '$$KEYCLOAK_DB_PASSWORD';
        CREATE DATABASE keycloak OWNER keycloak;
        INSERT INTO tenants (id, name) VALUES
          ('11111111-1111-1111-1111-111111111111', 'Acme'),
          ('22222222-2222-2222-2222-222222222222', 'Globex')
        ON CONFLICT (id) DO NOTHING;
        INSERT INTO api_tokens (tenant_id, token_hash, role) VALUES
          ('11111111-1111-1111-1111-111111111111', encode(digest('$$WIDGET_TOKEN','sha256'),'hex'), 'widget')
        ON CONFLICT (token_hash) DO NOTHING;
        SQL
        exec /usr/local/bin/docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-ccaas}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env.production}
      WIDGET_TOKEN: ${WIDGET_TOKEN:?set WIDGET_TOKEN in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/sh", "/opt/keycloak/bin/entrypoint-prod.sh"]
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env.production}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.production}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env.production}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env.production}
      AGENT_PASSWORD: ${AGENT_PASSWORD:?set AGENT_PASSWORD in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://ofcf.hostedservices.cloud}
      REALM_TEMPLATE: /opt/keycloak/bin/realm-prod.json.template
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env.production}
      KC_HOSTNAME: ${PUBLIC_BASE_URL:-https://ofcf.hostedservices.cloud}
      KC_HOSTNAME_PATH: /auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./scripts/entrypoint-prod.sh:/opt/keycloak/bin/entrypoint-prod.sh:ro
      - ./keycloak/realm-prod.json.template:/opt/keycloak/bin/realm-prod.json.template:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  core:
    build: .
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-ccaas}
      KEYCLOAK_ISSUER: ${PUBLIC_BASE_URL:-https://ofcf.hostedservices.cloud}/auth/realms/ccaas
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/ccaas/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: ${PUBLIC_BASE_URL:-https://ofcf.hostedservices.cloud}/auth/realms/ccaas/protocol/openid-connect/token
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-ccaas-spa}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://ofcf.hostedservices.cloud}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
